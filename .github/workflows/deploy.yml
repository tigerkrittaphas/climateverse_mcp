name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-global
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  WORKSPACE: global
  CLUSTER: climateverse-hdsi-global-cluster
  SERVICE: climateverse-hdsi-global-mcp
  REPOSITORY: climateverse-hdsi-global-mcp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra aws
      - run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # Output `mcp_github_actions_role_arn` of climateverse-infra (global).
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      # Terraform pins the task definition to the floating prod-<workspace>
      # tag, so a release is: push the tag, then roll the service.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:prod-${{ env.WORKSPACE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll ECS service
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
