[project]
name = "climateverse-mcp"
version = "0.1.0"
description = "MCP server for ClimateVerse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4",
]

[project.scripts]
climateverse-mcp = "climateverse_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climateverse_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
